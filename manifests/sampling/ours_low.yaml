apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  labels:
    sampling.policy: ours
    sampling.budget: low
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
          http:
    processors:
      tail_sampling:
        decision_wait: 10s
        num_traces: 20000
        expected_new_traces_per_sec: 80
        policies:
          - name: svc-productpage-low
            type: and
            and:
              and_sub_policy:
                - name: productpage-attr
                  type: string_attribute
                  string_attribute:
                    key: service.name
                    values: [productpage]
                - name: productpage-sample
                  type: probabilistic
                  probabilistic:
                    sampling_percentage: 2
          - name: svc-reviews-low
            type: and
            and:
              and_sub_policy:
                - name: reviews-attr
                  type: string_attribute
                  string_attribute:
                    key: service.name
                    values: [reviews]
                - name: reviews-sample
                  type: probabilistic
                  probabilistic:
                    sampling_percentage: 5
          - name: error-traces
            type: status_code
            status_code:
              status_codes: [ERROR]
      batch:
        timeout: 1s
    exporters:
      otlp/jaeger:
        endpoint: jaeger-collector.observability.svc.cluster.local:4317
        tls:
          insecure: true
      prometheus:
        endpoint: 0.0.0.0:8889
    service:
      telemetry:
        metrics:
          address: 0.0.0.0:8888
      pipelines:
        traces:
          receivers: [otlp]
          processors: [tail_sampling, batch]
          exporters: [otlp/jaeger]
