apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: fault-delay-any-to-productcatalogservice
  labels:
    app.kubernetes.io/managed-by: trace-exp
    fault.type: delay
spec:
  hosts:
  - productcatalogservice
  http:
  - fault:
      delay:
        fixedDelay: "200ms"
        percentage:
          value: 10
    route:
    - destination:
        host: productcatalogservice
